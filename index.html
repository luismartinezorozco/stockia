<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockia - Sistema de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF para Reportes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Animaciones para la pantalla de carga */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        .fade-out {
            opacity: 0;
            transform: scale(1.05);
            transition: all 0.7s ease-out;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex">

    <!-- Pantalla de Carga Premium -->
    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-slate-900 via-brand-900 to-slate-900 transition-all duration-700">
        <div class="relative flex flex-col items-center">
            <!-- Glow background -->
            <div class="absolute inset-0 bg-blue-500 blur-[60px] rounded-full animate-pulse-glow w-32 h-32 m-auto"></div>
            
            <!-- Logo Box -->
            <div class="relative z-10 bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-3xl shadow-2xl animate-float mb-8 flex items-center justify-center">
                <i class="fa-solid fa-cube text-5xl text-white"></i>
            </div>
            
            <h1 class="text-4xl font-bold text-white tracking-wider mb-3 relative z-10">STOCKIA</h1>
            <p class="text-blue-200 font-medium tracking-wide relative z-10 animate-pulse">Cada venta cuenta.</p>
        </div>
    </div>

    <!-- Contenedor Principal (Login o App) -->
    <div id="main-content" class="w-full h-full hidden">
        
        <!-- LOGIN SCREEN -->
        <div id="login-view" class="w-full h-full flex items-center justify-center bg-slate-100 hidden">
            <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-brand-600 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                        <i class="fa-solid fa-cube text-3xl text-white"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">Bienvenido a Stockia</h2>
                    <p class="text-slate-500 mt-1">Ingresa tus credenciales para continuar</p>
                </div>

                <form id="login-form" class="space-y-5" onsubmit="window.handleLogin(event)">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
                        <div class="flex items-center border border-slate-300 rounded-lg focus-within:ring-2 focus-within:ring-brand-500 bg-white overflow-hidden transition-all">
                            <input type="text" id="login-user" class="w-full px-4 py-3 outline-none bg-transparent" placeholder="ej. luis" required>
                            <span class="px-4 py-3 bg-slate-50 text-slate-500 font-medium border-l border-slate-200 select-none">@stockia.com</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                        <input type="password" id="login-pass" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none transition-all" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md mt-4">Ingresar al Sistema</button>
                </form>
            </div>
        </div>

        <!-- APP DASHBOARD -->
        <div id="app-view" class="w-full h-full flex hidden">
            <!-- Sidebar -->
            <aside class="w-64 bg-slate-900 text-white flex flex-col h-full shadow-2xl relative z-20">
                <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                    <div class="w-10 h-10 bg-brand-500 rounded-lg flex items-center justify-center shadow-inner">
                        <i class="fa-solid fa-cube text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-wide">Stockia</h1>
                        <p id="user-role-display" class="text-xs text-brand-300 uppercase font-semibold mt-1">Rol</p>
                    </div>
                </div>
                
                <div class="p-4 border-b border-slate-800">
                    <p class="text-sm text-slate-400">Usuario actual</p>
                    <p id="current-username" class="font-medium truncate mb-2">user@stockia.com</p>
                    <!-- Botón Cambiar Contraseña (Solo Admins) -->
                    <button id="btn-change-pass" onclick="window.openChangePasswordModal()" class="hidden w-full text-left text-xs text-slate-300 hover:text-white flex items-center gap-2 py-1 px-2 rounded hover:bg-slate-800 transition-colors">
                        <i class="fa-solid fa-key"></i> Cambiar contraseña
                    </button>
                </div>

                <nav id="sidebar-nav" class="flex-1 p-4 space-y-2 overflow-y-auto">
                    <!-- Nav items injected via JS based on role -->
                </nav>

                <div class="p-4 border-t border-slate-800">
                    <button onclick="window.logout()" class="w-full flex items-center gap-3 px-4 py-2 text-slate-300 hover:text-white hover:bg-red-500/20 rounded-lg transition-colors">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Cerrar Sesión</span>
                    </button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-1 bg-slate-50 flex flex-col h-full relative overflow-hidden">
                <!-- Header -->
                <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8 border-b border-slate-200 z-10 shrink-0">
                    <h2 id="page-title" class="text-xl font-bold text-slate-800">Dashboard</h2>
                    <div id="header-actions"></div>
                </header>

                <!-- Dynamic Content -->
                <div id="content-area" class="flex-1 p-8 overflow-y-auto">
                    <!-- Views injected here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Sistema de Notificaciones (Toast) -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Modal Base -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 transform scale-95 transition-transform">
            <!-- Modal dinámico -->
        </div>
    </div>

    <!-- Lógica de la Aplicación -->
    <script type="module">
        // Estado en Memoria
        let state = {
            users: [
                { id: 'sa1', username: 'luis@stockia.com', password: 'Lm17@5**', role: 'superadmin' }
            ],
            categories: [], // {id, name}
            products: [], // {id, categoryId, name, price, stock}
            sales: [], // {id, sellerId, sellerName, categoryId, items:[], total, date, timestamp}
            currentUser: null,
            cart: [] // Para el POS del vendedor
        };

        // Generador de IDs
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // --- SISTEMA DE TOAST ---
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';
            
            toast.className = `${color} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transform translate-y-10 opacity-0 transition-all duration-300`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${msg}</span>`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            });
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // --- MANEJO DE MODALES ---
        window.openModal = (htmlContent) => {
            const backdrop = document.getElementById('modal-backdrop');
            const content = document.getElementById('modal-content');
            content.innerHTML = htmlContent;
            
            backdrop.classList.remove('hidden');
            // Trigger reflow
            void backdrop.offsetWidth;
            backdrop.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        };

        window.closeModal = () => {
            const backdrop = document.getElementById('modal-backdrop');
            const content = document.getElementById('modal-content');
            
            backdrop.classList.add('opacity-0');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                backdrop.classList.add('hidden');
            }, 300);
        };

        // --- NAVEGACIÓN Y RENDERIZADO DE VISTAS ---
        const views = {
            superadmin: [
                { id: 'sa-sedes', label: 'Gestión de Sedes (Admins)', icon: 'fa-building', render: () => renderSuperAdminSedes() }
            ],
            admin: [
                { id: 'inv', label: 'Inventario', icon: 'fa-box', render: () => renderInventory() },
                { id: 'cat', label: 'Categorías', icon: 'fa-layer-group', render: () => renderCategories() },
                { id: 'users', label: 'Vendedores', icon: 'fa-users', render: () => renderUsers() },
                { id: 'rep', label: 'Reportes y Cierre', icon: 'fa-chart-pie', render: () => renderReports() }
            ],
            seller: [
                { id: 'pos', label: 'Punto de Venta', icon: 'fa-cash-register', render: () => renderPOS() }
            ]
        };

        window.loadView = (role, viewId) => {
            // Update active state in sidebar
            document.querySelectorAll('#sidebar-nav button').forEach(b => {
                b.classList.remove('bg-brand-600', 'text-white', 'shadow-md');
                b.classList.add('text-slate-300', 'hover:bg-slate-800');
            });
            const activeBtn = document.getElementById(`nav-${viewId}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-300', 'hover:bg-slate-800');
                activeBtn.classList.add('bg-brand-600', 'text-white', 'shadow-md');
            }

            const view = views[role].find(v => v.id === viewId);
            if(view) {
                document.getElementById('page-title').innerText = view.label;
                document.getElementById('header-actions').innerHTML = '';
                document.getElementById('content-area').innerHTML = view.render();
            }
        };

        // --- AUTH ---
        window.handleLogin = (e) => {
            e.preventDefault();
            // Toma lo que escribió, lo pasa a minúscula y corta si escribió @
            const rawUser = document.getElementById('login-user').value.trim().toLowerCase().split('@')[0];
            const u = rawUser + '@stockia.com';
            const p = document.getElementById('login-pass').value.trim();
            
            const user = state.users.find(x => x.username === u && x.password === p);
            
            if(user) {
                state.currentUser = user;
                document.getElementById('login-user').value = '';
                document.getElementById('login-pass').value = '';
                initApp();
            } else {
                window.showToast('Credenciales incorrectas', 'error');
            }
        };

        window.logout = () => {
            state.currentUser = null;
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        };

        const initApp = () => {
            const user = state.currentUser;
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            
            document.getElementById('current-username').innerText = user.username;
            
            // Mostrar botón de cambio de contraseña solo a Superadmin y Admin
            const btnPass = document.getElementById('btn-change-pass');
            if (user.role === 'superadmin' || user.role === 'admin') {
                btnPass.classList.remove('hidden');
            } else {
                btnPass.classList.add('hidden');
            }

            let roleDisplay = '';
            if (user.role === 'superadmin') roleDisplay = 'Súper Administrador (HQ)';
            else if (user.role === 'admin') roleDisplay = 'Administrador de Sede';
            else roleDisplay = 'Vendedor';
            
            document.getElementById('user-role-display').innerText = roleDisplay;

            // Build Navigation
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = '';
            views[user.role].forEach(view => {
                const btn = document.createElement('button');
                btn.id = `nav-${view.id}`;
                btn.className = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-left text-sm font-medium text-slate-300 hover:bg-slate-800';
                btn.innerHTML = `<i class="fa-solid ${view.icon} w-5 text-center"></i> <span>${view.label}</span>`;
                btn.onclick = () => window.loadView(user.role, view.id);
                nav.appendChild(btn);
            });

            // Load default view
            window.loadView(user.role, views[user.role][0].id);
        };

        // --- CAMBIO DE CONTRASEÑA ---
        window.openChangePasswordModal = () => {
            window.openModal(`
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">Cambiar Contraseña</h3>
                    <button onclick="window.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-times"></i></button>
                </div>
                <form onsubmit="window.saveNewPassword(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Nueva Contraseña</label>
                        <input type="password" id="new-pass" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none" placeholder="Min. 4 caracteres">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Confirmar Contraseña</label>
                        <input type="password" id="confirm-pass" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-brand-600 text-white font-semibold py-2 rounded-lg hover:bg-brand-700">Actualizar Contraseña</button>
                </form>
            `);
        };

        window.saveNewPassword = (e) => {
            e.preventDefault();
            const p1 = document.getElementById('new-pass').value.trim();
            const p2 = document.getElementById('confirm-pass').value.trim();

            if(p1.length < 4) return window.showToast('La contraseña debe ser más larga', 'error');
            if(p1 !== p2) return window.showToast('Las contraseñas no coinciden', 'error');

            const userIndex = state.users.findIndex(u => u.id === state.currentUser.id);
            if(userIndex > -1) {
                state.users[userIndex].password = p1;
                state.currentUser.password = p1;
                window.showToast('Contraseña actualizada con éxito');
                window.closeModal();
            }
        };


        // ==========================================
        // VISTAS SUPERADMIN
        // ==========================================
        const renderSuperAdminSedes = () => {
            document.getElementById('header-actions').innerHTML = `
                <button onclick="window.openSuperAdminUserModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors text-sm flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nueva Sede (Admin)
                </button>
            `;

            const admins = state.users.filter(u => u.role === 'admin');
            
            let html = `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                                <th class="p-4 font-semibold">Usuario Sede (Admin)</th>
                                <th class="p-4 font-semibold">Contraseña</th>
                                <th class="p-4 font-semibold text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
            `;

            if(admins.length === 0) {
                html += `<tr><td colspan="3" class="p-8 text-center text-slate-400">No hay sedes creadas.</td></tr>`;
            } else {
                admins.forEach(admin => {
                    html += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-4 font-medium text-slate-800">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs">A</div>
                                    ${admin.username}
                                </div>
                            </td>
                            <td class="p-4 text-slate-600 text-sm">
                                <span class="bg-slate-100 px-2 py-1 rounded text-xs font-mono border border-slate-200">${admin.password}</span>
                            </td>
                            <td class="p-4 text-right">
                                <button onclick="window.deleteUser('${admin.id}')" class="text-red-500 hover:text-red-700 p-2 rounded-lg hover:bg-red-50 transition-colors" title="Eliminar Admin">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            html += `</tbody></table></div>`;
            return html;
        };

        window.openSuperAdminUserModal = () => {
            window.openModal(`
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">Nuevo Administrador de Sede</h3>
                    <button onclick="window.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-times"></i></button>
                </div>
                <form onsubmit="window.saveUser(event, 'admin')" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Nombre de Usuario</label>
                        <div class="flex items-center border border-slate-300 rounded-lg focus-within:ring-2 focus-within:ring-brand-500 bg-white overflow-hidden">
                            <input type="text" id="u-name" required class="w-full px-3 py-2 outline-none" placeholder="ej. sede1">
                            <span class="px-3 py-2 bg-slate-50 text-slate-500 border-l border-slate-200 text-sm">@stockia.com</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Contraseña Inicial</label>
                        <input type="text" id="u-pass" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-brand-600 text-white font-semibold py-2 rounded-lg hover:bg-brand-700">Crear Administrador</button>
                </form>
            `);
        };


        // ==========================================
        // VISTAS ADMIN
        // ==========================================
        
        // --- INVENTARIO ---
        const renderInventory = () => {
            document.getElementById('header-actions').innerHTML = `
                <div class="flex gap-2">
                    <button onclick="window.openAuditModal()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-4 py-2 rounded-lg font-medium shadow-sm transition-colors text-sm flex items-center gap-2">
                        <i class="fa-solid fa-file-pdf"></i> Auditoría PDF
                    </button>
                    <button onclick="window.openProductModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors text-sm flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Nuevo Producto
                    </button>
                </div>
            `;

            let html = `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                                <th class="p-4 font-semibold">Producto</th>
                                <th class="p-4 font-semibold">Categoría</th>
                                <th class="p-4 font-semibold text-right">Precio</th>
                                <th class="p-4 font-semibold text-center">Stock</th>
                                <th class="p-4 font-semibold text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
            `;

            if(state.products.length === 0) {
                html += `<tr><td colspan="5" class="p-8 text-center text-slate-400">No hay productos en inventario.</td></tr>`;
            } else {
                state.products.forEach(p => {
                    const cat = state.categories.find(c => c.id === p.categoryId) || {name: 'Sin categoría'};
                    html += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-4 font-medium text-slate-800">${p.name}</td>
                            <td class="p-4 text-sm text-slate-500">
                                <span class="bg-slate-100 px-2 py-1 rounded border border-slate-200">${cat.name}</span>
                            </td>
                            <td class="p-4 text-right font-medium text-green-600">$${p.price.toLocaleString()}</td>
                            <td class="p-4 text-center">
                                <span class="${p.stock < 10 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'} px-2 py-1 rounded-full text-xs font-bold">
                                    ${p.stock}
                                </span>
                            </td>
                            <td class="p-4 text-right">
                                <button onclick="window.openProductModal('${p.id}')" class="text-blue-500 hover:text-blue-700 p-2 rounded-lg hover:bg-blue-50 mr-1"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="window.deleteProduct('${p.id}')" class="text-red-500 hover:text-red-700 p-2 rounded-lg hover:bg-red-50"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }
            html += `</tbody></table></div>`;
            return html;
        };

        window.openProductModal = (id = null) => {
            if(state.categories.length === 0) return window.showToast('Primero crea una Categoría', 'error');

            const p = id ? state.products.find(x => x.id === id) : {name: '', price: '', stock: '', categoryId: ''};
            
            const catOptions = state.categories.map(c => 
                `<option value="${c.id}" ${p.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`
            ).join('');

            window.openModal(`
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">${id ? 'Editar' : 'Nuevo'} Producto</h3>
                    <button onclick="window.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-times"></i></button>
                </div>
                <form onsubmit="window.saveProduct(event, '${id || ''}')" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Nombre</label>
                        <input type="text" id="p-name" value="${p.name}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Categoría</label>

        window.toggleAuditFilters = () => {

        window.generateAuditPDF = () => {
            const type = document.getElementById('audit-type').value;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const now = new Date();
            const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();

            doc.setFontSize(20);
            doc.text("STOCKIA - Reporte de Auditoría", 14, 20);
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text(`Generado el: ${dateStr}`, 14, 28);
            doc.text(`Generado por: ${state.currentUser.username}`, 14, 33);

            if(type === 'inventory') {
                doc.text("Tipo: Existencias de Inventario Actual", 14, 38);
                
                let totalValue = 0;
                let tableData = [];
                
                state.products.forEach(p => {
                    const cat = state.categories.find(c => c.id === p.categoryId)?.name || 'N/A';
                    const val = p.price * p.stock;
                    totalValue += val;
                    tableData.push([p.name, cat, `$${p.price.toLocaleString()}`, p.stock, `$${val.toLocaleString()}`]);
                });

                doc.autoTable({
                    startY: 45,
                    head: [['Producto', 'Categoría', 'Precio Unit.', 'Stock', 'Valor Total']],
                    body: tableData,
                    theme: 'grid',
                    headStyles: { fillColor: [37, 99, 235] }
                });

                const finalY = doc.lastAutoTable.finalY || 45;
                doc.setFontSize(12);
                doc.setTextColor(0);
                doc.text(`Valoración Total del Inventario: $${totalValue.toLocaleString()}`, 14, finalY + 10);

            } else {
                // Ventas
                const timeFilter = document.getElementById('audit-time').value;
                const catFilter = document.getElementById('audit-cat').value;
                const sellerFilter = document.getElementById('audit-seller').value;

                doc.text(`Tipo: Historial de Ventas`, 14, 38);
                doc.text(`Filtros: Periodo(${timeFilter}), Categ(${catFilter}), Vendedor(${sellerFilter})`, 14, 43);

                let filteredSales = state.sales.filter(s => {
                    let match = true;
                    // Filtro Vendedor/Categoria
                    if(catFilter !== 'all' && s.categoryId !== catFilter) match = false;
                    if(sellerFilter !== 'all' && s.sellerId !== sellerFilter) match = false;
                    
                    // Filtro Tiempo
                    const sDate = new Date(s.timestamp);
                    if(timeFilter === 'today') {
                        if(sDate.toLocaleDateString() !== now.toLocaleDateString()) match = false;
                    } else if(timeFilter === 'week') {
                        const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
                        if(sDate < weekAgo) match = false;
                    } else if(timeFilter === 'month') {
                        const monthAgo = new Date(); monthAgo.setMonth(monthAgo.getMonth() - 1);
                        if(sDate < monthAgo) match = false;
                    }
                    return match;
                });

                let totalSales = 0;
                let tableData = [];

                filteredSales.forEach(s => {

                    theme: 'grid',

                doc.setTextColor(0);
                doc.text(`Total Recaudado en periodo: $${totalSales.toLocaleString()}`, 14, finalY + 12);

            window.showToast('Auditoría PDF generada y descargada');

        const generatePOSProducts = (catId) => {
            const prods = state.products.filter(p => p.categoryId === catId);
            if(prods.length === 0) return `<div class="col-span-full text-center text-slate-400 mt-10">No hay productos en esta sección.</div>`;
            
            return prods.map(p => {
                const outOfStock = p.stock === 0;
                return `
                    <div onclick="${outOfStock ? '' : `window.addToCart('${p.id}')`}" class="${outOfStock ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:border-brand-500 hover:shadow-md'} bg-white border border-slate-200 rounded-xl p-4 transition-all flex flex-col h-full select-none">
                        <div class="flex-1 mb-2">
                            <h4 class="font-bold text-slate-800 leading-tight">${p.name}</h4>
                            <p class="text-green-600 font-bold mt-1">$${p.price.toLocaleString()}</p>
                        </div>
                        <div class="text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded inline-block w-max">
                            Stock: <span class="${p.stock < 5 ? 'text-red-500 font-bold' : ''}">${p.stock}</span>
                        </div>
                    </div>
                `;
            }).join('');
        };

        const generateCartHTML = () => {
            if(state.cart.length === 0) return `<div class="text-center text-slate-400 mt-10"><i class="fa-solid fa-basket-shopping text-4xl mb-3 opacity-50"></i><p>El carrito está vacío</p></div>`;
            
            let total = 0;
            let html = '<ul class="space-y-3">';
            state.cart.forEach((item, index) => {
                const p = state.products.find(x => x.id === item.id);
                const itemTotal = p.price * item.qty;
                total += itemTotal;
                html += `
                    <li class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <div class="flex-1">
                            <p class="font-bold text-slate-800 text-sm">${p.name}</p>
                            <p class="text-xs text-slate-500">$${p.price.toLocaleString()} x ${item.qty}</p>
                        </div>
                        <div class="font-bold text-slate-800 w-20 text-right">$${itemTotal.toLocaleString()}</div>
                        <button onclick="window.removeFromCart(${index})" class="text-red-400 hover:text-red-600 ml-3"><i class="fa-solid fa-times-circle"></i></button>
                    </li>
                `;
            });
            html += '</ul>';
            
            // Actualizar total del botón
            setTimeout(() => {
                const btnTotal = document.getElementById('cart-total-display');
                if(btnTotal) btnTotal.innerText = `$${total.toLocaleString()}`;
                
                const btnCheckout = document.getElementById('btn-checkout');
                if(btnCheckout) {
                    if(state.cart.length === 0) btnCheckout.classList.add('opacity-50', 'pointer-events-none');
                    else btnCheckout.classList.remove('opacity-50', 'pointer-events-none');
                }
            }, 0);
            
            return html;
        };

        window.addToCart = (id) => {
            const p = state.products.find(x => x.id === id);
            const cartItem = state.cart.find(x => x.id === id);
            const currentQty = cartItem ? cartItem.qty : 0;
            
            if(currentQty + 1 > p.stock) return window.showToast('Stock insuficiente', 'error');
            
            if(cartItem) cartItem.qty++;
            else state.cart.push({ id, qty: 1 });
            
            document.getElementById('pos-cart').innerHTML = generateCartHTML();
        };

        window.removeFromCart = (index) => {
            state.cart.splice(index, 1);
            document.getElementById('pos-cart').innerHTML = generateCartHTML();
        };

        window.clearCart = () => {
            state.cart = [];
            document.getElementById('pos-cart').innerHTML = generateCartHTML();
        };

        window.checkout = () => {
            if(state.cart.length === 0) return;
            
            let total = 0;
            const itemsToSave = [];
            
            // Descontar inventario
            state.cart.forEach(item => {
                const p = state.products.find(x => x.id === item.id);
                p.stock -= item.qty;
                total += p.price * item.qty;
                itemsToSave.push({ id: p.id, name: p.name, qty: item.qty, price: p.price });
            });
            
            // Registrar Venta
            const now = new Date();
            state.sales.push({
                id: generateId(),
                sellerId: state.currentUser.id,
                sellerName: state.currentUser.username,
                categoryId: state.currentUser.categoryId,
                items: itemsToSave,
                total: total,
                date: now.toLocaleDateString() + ' ' + now.toLocaleTimeString(),
                timestamp: now.getTime()
            });
            
            state.cart = [];
            window.showToast('Venta registrada con éxito');
            window.loadView('seller', 'pos'); // Recargar para actualizar stock visual
        };

        window.showSellerSales = () => {
            const seller = state.currentUser;
            const today = new Date().toLocaleDateString();
            const mySales = state.sales.filter(s => s.sellerId === seller.id && new Date(s.timestamp).toLocaleDateString() === today);
            
            const total = mySales.reduce((sum, s) => sum + s.total, 0);

            let html = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">Mis Ventas (Hoy)</h3>
                    <button onclick="window.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4 mb-4 flex justify-between items-center">
                    <div>
                        <p class="text-sm text-indigo-600 font-medium">Recaudado Hoy</p>
                        <p class="text-2xl font-bold text-indigo-900">$${total.toLocaleString()}</p>
                    </div>
                    <i class="fa-solid fa-sack-dollar text-3xl text-indigo-200"></i>
                </div>
                <div class="max-h-64 overflow-y-auto">
                    <ul class="space-y-2">
            `;

            if(mySales.length === 0) {
                html += `<li class="text-center text-slate-400 py-4">Aún no tienes ventas hoy.</li>`;
            } else {
                mySales.reverse().forEach(s => {
                    const time = new Date(s.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    html += `
                        <li class="bg-slate-50 border border-slate-100 rounded p-3 flex justify-between items-center">
                            <div>
                                <p class="text-xs text-slate-400 mb-1"><i class="fa-regular fa-clock"></i> ${time}</p>
                                <p class="text-sm font-medium text-slate-700">${s.items.length} artículo(s)</p>
                            </div>
                            <span class="font-bold text-green-600">$${s.total.toLocaleString()}</span>
                        </li>
                    `;
                });
            }
            html += `</ul></div>`;
            window.openModal(html);
        };

        // --- INICIALIZACIÓN VISUAL ---
        window.onload = () => {
            // Simulamos la carga premium y conexión (2.5 segundos)
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.classList.add('fade-out');
                
                setTimeout(() => {
                    loader.classList.add('hidden');
                    document.getElementById('main-content').classList.remove('hidden');
                    document.getElementById('login-view').classList.remove('hidden');
                }, 700); // Esperar que termine la transición CSS fade-out
                
            }, 2500);
        };

    </script>
</body>
</html>
